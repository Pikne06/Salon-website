<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Welcome</title>
<style>
body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f4f6f8;
    font-family: Arial, sans-serif;
    margin: 0;
}
h1 {
    text-align: center;
    color: #333;
}
img {
    display: block;
    max-width: 400px;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    margin: 20px auto 0;
}
button {
    margin-top: 20px;
    padding: 10px 20px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    transition: background-color 0.2s;
}
button:hover { background-color: #0056b3; }
</style>
</head>
<body>
<h1>Welcome, {{ username }}. You are all set.</h1>
<img src="{{ url_for('static', filename='thumbsup.webp') }}" alt="Welcome!">
<a href="/login"><button>Back to sign in</button></a>
</body>
</html>
